identity:
  author: livetennisapi
  name: livetennisapi
  label:
    en_US: Live Tennis API
  description:
    en_US: Live tennis scores, schedules, players and fixtures across ATP, WTA, Challenger and ITF. Every tool is a read - nothing is ever written or changed.
  icon: icon.png
  tags:
    - news
    - entertainment
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: Live Tennis API Key
    placeholder:
      en_US: twjp_...
    help:
      en_US: Your Live Tennis API key. A free key with no card required is available at https://livetennisapi.com/subscribe/free
    url: https://livetennisapi.com/subscribe/free
tools:
  - tools/get_matches.yaml
  - tools/get_match.yaml
  - tools/get_match_score.yaml
  - tools/search_players.yaml
  - tools/get_player.yaml
  - tools/get_fixtures.yaml
extra:
  python:
    source: provider/livetennisapi.py
