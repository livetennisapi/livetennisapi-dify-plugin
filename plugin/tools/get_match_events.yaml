identity:
  name: get_match_events
  author: livetennisapi
  label:
    en_US: "Match timeline"
description:
  human:
    en_US: "Timeline of events for a match - breaks, games won, sets won, momentum runs. Requires the PRO plan."
  llm: "Timeline of events for a match - breaks, games won, sets won, momentum runs. Requires the PRO plan."
output_schema:
  type: object
  properties:
    ok:
      type: boolean
      description: True when the call returned data. False for a tier wall, a missing or rejected key, or an empty result - all normal states with a clear remedy, not failures.
    message:
      type: string
      description: Human-readable summary. Identical to the text output, so either half can be used alone.
    reason:
      type: string
      nullable: true
      description: Why no data was returned, when ok is false. One of no_api_key, unauthorized, upgrade_required, not_found, rate_limited, invalid_parameter, connection_error, request_failed.
    events:
      type: array
      description: Events in chronological order.
      items:
        type: object
        properties:
          timestamp:
            type: string
            nullable: true
            description: When the event occurred.
          type:
            type: string
            nullable: true
            description: Event type, e.g. break, game, set.
          player:
            type: number
            nullable: true
            description: Player the event belongs to, 1 or 2.
parameters:
  - name: match_id
    type: number
    required: true
    label:
      en_US: Match ID
    human_description:
      en_US: The match id, as returned by get_live_matches, get_upcoming_matches or get_recent_results.
    llm_description: Match id, as returned by get_live_matches, get_upcoming_matches or get_recent_results.
    form: llm
  - name: limit
    type: number
    required: false
    default: 30
    min: 1
    max: 200
    label:
      en_US: Limit
    human_description:
      en_US: Maximum events to return (1-200).
    llm_description: Maximum events to return (1-200). Defaults to 30.
    form: llm
extra:
  python:
    source: tools/get_match_events.py
