identity:
  name: check_api_status
  author: livetennisapi
  label:
    en_US: "API status and plan"
description:
  human:
    en_US: "Check whether the Live Tennis API is reachable and which plan the configured key is on. Useful for diagnosing why other tools are refusing data."
  llm: "Check whether the Live Tennis API is reachable and which plan the configured key is on. Useful for diagnosing why other tools are refusing data."
output_schema:
  type: object
  properties:
    ok:
      type: boolean
      description: True when the call returned data. False for a tier wall, a missing or rejected key, or an empty result - all normal states with a clear remedy, not failures.
    message:
      type: string
      description: Human-readable summary. Identical to the text output, so either half can be used alone.
    reason:
      type: string
      nullable: true
      description: Why no data was returned, when ok is false. One of no_api_key, unauthorized, upgrade_required, not_found, rate_limited, invalid_parameter, connection_error, request_failed.
    reachable:
      type: boolean
      nullable: true
      description: True when the API answered its health check.
    api_version:
      type: string
      nullable: true
      description: API version reported by the health check.
    tier:
      type: string
      nullable: true
      description: Detected plan - FREE, BASIC, PRO or ULTRA. Null when no key is configured.
    has_key:
      type: boolean
      nullable: true
      description: Whether a key was configured for this call.
parameters:
  []
extra:
  python:
    source: tools/check_api_status.py
