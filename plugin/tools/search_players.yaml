identity:
  name: search_players
  author: livetennisapi
  label:
    en_US: "Search players"
description:
  human:
    en_US: "Search tennis players by name. Returns id, country, ranking and tour."
  llm: "Search tennis players by name. Returns id, country, ranking and tour. Use the returned id with get_player."
output_schema:
  type: object
  properties:
    ok:
      type: boolean
      description: True when the call returned data. False for a tier wall, a missing or rejected key, or an empty result - all normal states with a clear remedy, not failures.
    message:
      type: string
      description: Human-readable summary. Identical to the text output, so either half can be used alone.
    reason:
      type: string
      nullable: true
      description: Why no data was returned, when ok is false. One of no_api_key, unauthorized, upgrade_required, not_found, rate_limited, invalid_parameter, connection_error, request_failed.
    players:
      type: array
      description: Matching players, best match first.
      items:
        type: object
        properties:
          id:
            type: number
            nullable: true
            description: Player id. Pass to get_player.
          name:
            type: string
            nullable: true
            description: Player name.
          country:
            type: string
            nullable: true
            description: Country code.
          ranking:
            type: number
            nullable: true
            description: Current singles ranking.
          ranking_points:
            type: number
            nullable: true
            description: Ranking points.
          ranking_movement:
            type: string
            nullable: true
            description: Recent movement in the rankings.
          hand:
            type: string
            nullable: true
            description: R or L.
          birthday:
            type: string
            nullable: true
            description: Date of birth, ISO date.
          tour:
            type: string
            nullable: true
            description: ATP, WTA, Challenger or ITF.
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Query
    human_description:
      en_US: Full or partial player name, e.g. alcaraz.
    llm_description: Full or partial player name, e.g. alcaraz.
    form: llm
  - name: limit
    type: number
    required: false
    default: 10
    min: 1
    max: 200
    label:
      en_US: Limit
    human_description:
      en_US: Maximum players to return (1-200).
    llm_description: Maximum players to return (1-200). Defaults to 10.
    form: llm
extra:
  python:
    source: tools/search_players.py
