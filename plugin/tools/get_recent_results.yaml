identity:
  name: get_recent_results
  author: livetennisapi
  label:
    en_US: "Recent results"
description:
  human:
    en_US: "Recently completed tennis matches with final scores and winners. Requires the BASIC plan or higher."
  llm: "Recently completed tennis matches with final scores and winners."
output_schema:
  type: object
  properties:
    ok:
      type: boolean
      description: True when the call returned data. False for a tier wall, a missing or rejected key, or an empty result - all normal states with a clear remedy, not failures.
    message:
      type: string
      description: Human-readable summary. Identical to the text output, so either half can be used alone.
    reason:
      type: string
      nullable: true
      description: Why no data was returned, when ok is false. One of no_api_key, unauthorized, upgrade_required, not_found, rate_limited, invalid_parameter, connection_error, request_failed.
    matches:
      type: array
      description: Completed matches, most recent first.
      items:
        type: object
        properties:
          id:
            type: number
            nullable: true
            description: Match id. Pass to get_match, get_match_score, get_match_events or get_match_odds.
          tournament:
            type: string
            nullable: true
            description: Event name, e.g. Wimbledon.
          round:
            type: string
            nullable: true
            description: Round within the event, e.g. QF.
          player1:
            type: string
            nullable: true
            description: Name of player 1.
          player2:
            type: string
            nullable: true
            description: Name of player 2.
          score:
            type: string
            nullable: true
            description: Formatted score line, e.g. 6-4 3-6 2-1.
          status:
            type: string
            nullable: true
            description: One of live, upcoming or completed.
          surface:
            type: string
            nullable: true
            description: Court surface, e.g. hard, clay, grass.
          indoor:
            type: boolean
            nullable: true
            description: True when played indoors.
          serving:
            type: number
            nullable: true
            description: 1 or 2 while a point is in play, otherwise null.
          winner:
            type: number
            nullable: true
            description: 1 or 2 once decided, otherwise null.
          win_probability_p1:
            type: number
            nullable: true
            description: Model probability that player 1 wins, 0-1. Requires the ULTRA plan; null otherwise.
parameters:
  - name: limit
    type: number
    required: false
    default: 20
    min: 1
    max: 200
    label:
      en_US: Limit
    human_description:
      en_US: Maximum matches to return (1-200).
    llm_description: Maximum matches to return (1-200). Defaults to 20.
    form: llm
extra:
  python:
    source: tools/get_recent_results.py
