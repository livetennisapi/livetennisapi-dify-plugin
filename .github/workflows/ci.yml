name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, test, truthcheck, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The runner version declared in plugin/manifest.yaml.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plugin/requirements.txt ruff

      - name: Lint
        run: ruff check plugin test

      - name: Truth pin
        run: sh scripts/truthcheck.sh

      - name: Offline tool suite (stub server, no credentials)
        run: python test/test_tools.py

      - name: Package check (.difypkg builds cleanly)
        run: |
          curl -sL -o /tmp/dify \
            https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.5/dify-plugin-linux-amd64
          chmod +x /tmp/dify
          /tmp/dify plugin package ./plugin -o /tmp/livetennisapi-ci.difypkg
          # The package must hold runtime files only -- no tests, caches or VCS.
          # -Z1 lists bare paths, so the archive's own name cannot false-match.
          unzip -Z1 /tmp/livetennisapi-ci.difypkg
          if unzip -Z1 /tmp/livetennisapi-ci.difypkg | grep -E '^test/|__pycache__|^\.git|\.difypkg$'; then
            echo 'package contains non-runtime files' && exit 1
          fi
