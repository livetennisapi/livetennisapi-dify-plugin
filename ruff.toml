# Lint policy for the plugin source and the offline test suite.
# Pinned here so `ruff check` means the same thing locally and in CI,
# whatever rule set a future ruff enables by default.
line-length = 120
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
# `livetennisapi_client` is the plugin's own shared module (it sits next to
# the tools, not on PyPI); `stub_api` is the test suite's local stub.
known-first-party = ["livetennisapi_client", "stub_api"]
